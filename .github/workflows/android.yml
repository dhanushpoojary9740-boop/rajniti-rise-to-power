name: RAJNITI Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed RAJNITI APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      RAJNITI_KEYSTORE_PASSWORD: ${{ secrets.RAJNITI_KEYSTORE_PASSWORD }}
      RAJNITI_KEY_ALIAS: rajniti-release
      RAJNITI_KEY_PASSWORD: ${{ secrets.RAJNITI_KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secret
        env:
          KEYSTORE_BASE64: ${{ secrets.RAJNITI_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$RAJNITI_KEYSTORE_PASSWORD" ] || [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing GitHub Actions secrets. Add RAJNITI_KEYSTORE_BASE64 and RAJNITI_KEYSTORE_PASSWORD before building."
            exit 1
          fi

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Enable adaptive Android orientation
        shell: bash
        run: |
          python3 - <<'PY'
          import re

          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, encoding='utf-8') as file:
              text = file.read()

          activity_tags = list(re.finditer(r'<activity\b[^>]*>', text, re.DOTALL))
          if not activity_tags:
              raise SystemExit('No activity element found in AndroidManifest.xml')

          main_activity = None
          for match in activity_tags:
              if 'MainActivity' in match.group(0):
                  main_activity = match
                  break

          selected = main_activity or activity_tags[0]
          tag = selected.group(0)
          orientation_attribute = 'android:screenOrientation="[^"]*"'

          if re.search(orientation_attribute, tag):
              updated_tag = re.sub(
                  orientation_attribute,
                  'android:screenOrientation="sensor"',
                  tag,
                  count=1
              )
          else:
              updated_tag = tag[:-1] + ' android:screenOrientation="sensor">'

          text = text[:selected.start()] + updated_tag + text[selected.end():]
          with open(path, 'w', encoding='utf-8') as file:
              file.write(text)

          print('Adaptive orientation enabled: portrait and landscape')
          PY

      - name: Configure permanent release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RAJNITI_KEYSTORE_BASE64 }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          mkdir -p android/app/keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore/rajniti-release.jks
          chmod 600 android/app/keystore/rajniti-release.jks
          python3 - <<'PY'
          import os, re
          path = 'android/app/build.gradle'
          text = open(path, encoding='utf-8').read()
          run_number = int(os.environ['RUN_NUMBER'])
          version_code = 1000 + run_number
          version_name = f"2.7.0.{run_number}"
          text, count = re.subn(r'versionCode\s+\d+', f'versionCode {version_code}', text, count=1)
          if count != 1:
              raise SystemExit('Could not set Android versionCode')
          text, count = re.subn(r'versionName\s+"[^"]+"', f'versionName "{version_name}"', text, count=1)
          if count != 1:
              raise SystemExit('Could not set Android versionName')
          if 'signingConfigs {' not in text:
              signing = """    signingConfigs {
                  release {
                      storeFile file("keystore/rajniti-release.jks")
                      storePassword System.getenv("RAJNITI_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("RAJNITI_KEY_ALIAS")
                      keyPassword System.getenv("RAJNITI_KEY_PASSWORD")
                  }
              }
          """
              text = text.replace('    buildTypes {', signing + '    buildTypes {', 1)
          if 'signingConfig signingConfigs.release' not in text:
              text = re.sub(r'(buildTypes\s*\{\s*release\s*\{)', r'\1\n            signingConfig signingConfigs.release', text, count=1)
          if 'signingConfig signingConfigs.release' not in text:
              raise SystemExit('Could not attach release signing configuration')
          open(path, 'w', encoding='utf-8').write(text)
          PY

      - name: Build signed release APK (retry transient repository rate limits)
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Gradle build attempt ${attempt}/3"
            if ./gradlew assembleRelease --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; waiting 45 seconds before retrying dependency downloads..."
              sleep 45
            fi
          done
          echo "Gradle build failed after 3 attempts. Review the final Gradle error above."
          exit 1

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: RAJNITI-Signed-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
